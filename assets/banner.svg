<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="100%" height="100%">
  <defs>
    <!-- Background Linear Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070b19" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#0a0f24" />
    </linearGradient>

    <!-- Glowing Accent Gradients -->
    <linearGradient id="cyberCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <linearGradient id="cyberCrimson" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="100%" stop-color="#dc2626" />
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="radarGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.8" opacity="0.65" />
    </pattern>

    <!-- Radar Sweep Gradient -->
    <linearGradient id="sweepGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0" />
    </linearGradient>
  </defs>

  <style>
    /* Radar Sweeper */
    @keyframes radarSpin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    .sweep-line {
      transform-origin: 1020px 170px;
      animation: radarSpin 7s linear infinite;
    }

    /* Radar Ping Blips */
    @keyframes pingBlip {
      0%, 100% { opacity: 0.2; transform: scale(0.85); }
      50% { opacity: 1; transform: scale(1.2); }
    }
    .blip-1 { transform-origin: 970px 130px; animation: pingBlip 2.5s ease-in-out infinite; }
    .blip-2 { transform-origin: 1080px 220px; animation: pingBlip 3.2s ease-in-out infinite 0.9s; }
    .blip-3 { transform-origin: 1050px 105px; animation: pingBlip 2s ease-in-out infinite 1.4s; }

    /* Floating Data Pulse Stream */
    @keyframes beamFlow {
      0% { stroke-dashoffset: 600; opacity: 0.15; }
      50% { opacity: 0.7; }
      100% { stroke-dashoffset: 0; opacity: 0.15; }
    }
    .data-beam-1 {
      stroke-dasharray: 80 120;
      animation: beamFlow 5s linear infinite;
    }
    .data-beam-2 {
      stroke-dasharray: 60 140;
      animation: beamFlow 6s linear infinite 1.5s;
    }

    /* Target Reticle Rotation */
    @keyframes reticleRotate {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(-360deg); }
    }
    .reticle-ring {
      transform-origin: 1020px 170px;
      animation: reticleRotate 24s linear infinite;
    }
  </style>

  <!-- Deep Background -->
  <rect width="1200" height="340" rx="16" fill="url(#bgGrad)" />

  <!-- Grid overlay in background -->
  <rect width="1200" height="340" rx="16" fill="url(#radarGrid)" />

  <!-- Dynamic Background Ambient Wave Beams (strictly behind text) -->
  <g opacity="0.4">
    <path class="data-beam-1" d="M 0,260 Q 300,190 600,240 T 1200,210" fill="none" stroke="#06b6d4" stroke-width="2" />
    <path class="data-beam-2" d="M 0,100 Q 350,140 700,90 T 1200,120" fill="none" stroke="#3b82f6" stroke-width="1.8" />
  </g>

  <!-- Right-Hand Radar & IOC Detection HUD (Dynamic Graphic Element) -->
  <g opacity="0.88">
    <!-- Concentric radar circles -->
    <circle cx="1020" cy="170" r="130" fill="none" stroke="#1e3a8a" stroke-width="1.2" stroke-dasharray="4 4" opacity="0.4" />
    <circle cx="1020" cy="170" r="95" fill="none" stroke="#0284c7" stroke-width="1.4" opacity="0.5" />
    <circle cx="1020" cy="170" r="60" fill="none" stroke="#0ea5e9" stroke-width="1.5" opacity="0.65" />
    <circle cx="1020" cy="170" r="25" fill="#0369a1" fill-opacity="0.15" stroke="#38bdf8" stroke-width="1.5" />

    <!-- Crosshairs -->
    <line x1="880" y1="170" x2="1160" y2="170" stroke="#0284c7" stroke-width="1" stroke-dasharray="3 3" opacity="0.45" />
    <line x1="1020" y1="30" x2="1020" y2="310" stroke="#0284c7" stroke-width="1" stroke-dasharray="3 3" opacity="0.45" />

    <!-- Rotating Segment Ring -->
    <circle class="reticle-ring" cx="1020" cy="170" r="115" fill="none" stroke="#06b6d4" stroke-width="2" stroke-dasharray="18 42" opacity="0.75" />

    <!-- Dynamic Radar Sweep Line -->
    <g class="sweep-line">
      <path d="M 1020 170 L 1150 170 A 130 130 0 0 0 1112 78 Z" fill="url(#sweepGrad)" />
      <line x1="1020" y1="170" x2="1150" y2="170" stroke="#38bdf8" stroke-width="2.5" />
    </g>

    <!-- Radar Detections / Threat Blips -->
    <circle class="blip-1" cx="970" cy="130" r="4.5" fill="#ef4444" />
    <circle class="blip-2" cx="1080" cy="220" r="4" fill="#f59e0b" />
    <circle class="blip-3" cx="1050" cy="105" r="3.5" fill="#10b981" />
  </g>

  <!-- Border Frame -->
  <rect x="1.5" y="1.5" width="1197" height="337" rx="15" fill="none" stroke="#1e293b" stroke-width="2.5" />
  <rect x="12" y="12" width="1176" height="316" rx="10" fill="none" stroke="#0ea5e9" stroke-width="1" opacity="0.25" stroke-dasharray="8 6" />

  <!-- Foreground Content: Header & Text Layer (Guaranteed Clean Foreground Visibility) -->
  <g>
    <!-- Status / Threat Hunting Badge -->
    <g transform="translate(60, 48)">
      <rect width="210" height="28" rx="14" fill="#0f172a" stroke="#06b6d4" stroke-width="1.2" />
      <circle cx="16" cy="14" r="5" fill="#10b981">
        <animate attributeName="opacity" values="1;0.3;1" dur="1.8s" repeatCount="indefinite" />
      </circle>
      <text x="30" y="18" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" letter-spacing="1.2">REAL-TIME TELEMETRY</text>
    </g>

    <!-- Main Title -->
    <text x="60" y="130" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="37" font-weight="800" letter-spacing="-0.5">
      Awesome Real-Time Threat Hunting
    </text>
    <text x="60" y="174" fill="url(#cyberCyan)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="33" font-weight="800" letter-spacing="-0.5">
      &amp; IOC Scanning Platform
    </text>

    <!-- Subtitle -->
    <text x="60" y="215" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="400">
      Curated commercial SaaS platforms, open-source scanners, YARA rules, and CTI frameworks
    </text>

    <!-- Capability Tag Badges -->
    <g transform="translate(60, 246)">
      <!-- Tag 1 -->
      <rect x="0" y="0" width="128" height="26" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="12" y="17" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">🎯 Proactive Hunts</text>

      <!-- Tag 2 -->
      <rect x="138" y="0" width="134" height="26" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="150" y="17" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">⚡ Fast IOC Match</text>

      <!-- Tag 3 -->
      <rect x="282" y="0" width="138" height="26" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="294" y="17" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">🛡️ MITRE ATT&amp;CK</text>

      <!-- Tag 4 -->
      <rect x="430" y="0" width="144" height="26" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="442" y="17" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">🌐 Threat Feeds</text>
    </g>
  </g>
</svg>